<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SURGE Passenger Guidance System - Real-time congestion monitoring and navigation assistance"
    />
    <title>SURGE Passenger Interface</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>SURGE PASSENGER</h1>
      </header>

      <main>
        <!-- QR Code Section -->
        <section id="qr-code-section" class="card" aria-labelledby="qr-heading">
          <h2 id="qr-heading">Your SURGE ID</h2>
          <div id="qr-code-display" class="qr-container">
            <img
              id="qr-code-image"
              src=""
              alt="Your unique SURGE QR code for checkpoint scanning"
            />
          </div>
          <p id="surge-id-text" class="surge-id" aria-live="polite">
            Loading...
          </p>
          <p class="instructions">Scan this code at designated checkpoints</p>
        </section>

        <!-- Current Zone Info -->
        <section id="zone-info" class="card" aria-labelledby="zone-heading">
          <h2 id="zone-heading">Current Zone</h2>
          <p id="zone-name" aria-live="polite">Loading...</p>
          <p id="zone-status" class="status" role="status" aria-live="polite">
            Checking congestion...
          </p>
        </section>

        <!-- Guidance -->
        <section id="guidance" class="card" aria-labelledby="guidance-heading">
          <h2 id="guidance-heading">Guidance</h2>
          <p id="guidance-text" aria-live="polite">
            Please wait while we fetch guidance...
          </p>
        </section>

        <!-- Wait Time -->
        <section id="wait-time" class="card" aria-labelledby="wait-heading">
          <h2 id="wait-heading">Estimated Wait Time</h2>
          <p id="wait-time-text" aria-live="polite">Calculating...</p>
        </section>

        <!-- Alternative Suggestions -->
        <section
          id="alternatives"
          class="card"
          aria-labelledby="alternatives-heading"
        >
          <h2 id="alternatives-heading">Low-Congestion Areas</h2>
          <ul id="alternatives-list" aria-live="polite"></ul>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
