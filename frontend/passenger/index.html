<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SURGE – Passenger Guidance</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <h1>SURGE Passenger Guidance</h1>

      <div id="current-zone" class="card">
        <h2>Next Zone</h2>
        <p id="next-zone-name">Loading...</p>
      </div>

      <div id="guidance" class="card">
        <h2>Status</h2>
        <p id="guidance-message">Fetching congestion data...</p>
        <p id="wait-time"></p>
      </div>

      <div id="alternatives" class="card hidden">
        <h2>Suggested Alternatives</h2>
        <ul id="alternative-list"></ul>
      </div>

      <p class="timestamp" id="last-updated"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
